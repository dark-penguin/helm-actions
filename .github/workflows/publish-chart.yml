name: publish-chart

on:
  push:
    tags:
      - "*"
  workflow_dispatch:  # Allow manually launching the workflow
    inputs:
      version:  # But you'll have to specify chart version
        description: Chart version (without leading v)
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  HELM_VERSION: "4.3.1"

jobs:
  publish-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Helm
        uses: Azure/setup-helm@v5 # Github / Act
        with:
          version: "${{ env.HELM_VERSION }}"

      - name: Install helm-push plugin (Gitea)
        if: ${{ env.GITEA_ACTIONS == 'true' }}
        run: |
          helm plugin install --verify=false https://github.com/chartmuseum/helm-push --version 0.11.1

      - name: Package chart
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ -n "$VERSION" ]] || VERSION="${GITHUB_REF_NAME#v}"
          helm dependency build
          mkdir -p ./output
          helm package --version "$VERSION" --destination ./output ./

      - name: Publish chart (Gitea)
        if: ${{ env.GITEA_ACTIONS == 'true' }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ -n "$VERSION" ]] || VERSION="${GITHUB_REF_NAME#v}"
          echo "Logging in as '${GITHUB_ACTOR}:${{ secrets.MY_PACKAGE_TOKEN }}'..."
          helm repo add gitea ${GITHUB_SERVER_URL}/api/packages/${GITHUB_REPOSITORY_OWNER}/helm \
            --username "${GITHUB_ACTOR}" \
            --password "${{ secrets.MY_PACKAGE_TOKEN }}" \
            && echo "Logged in" || { echo "Failed to log in"; exit 1; }
          echo -e "\nPublishing ..."
          helm cm-push "./output/actions-${VERSION}.tgz" gitea

      - name: Publish chart (Github)
        if: ${{ env.GITEA_ACTIONS != 'true' }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ -n "$VERSION" ]] || VERSION="${GITHUB_REF_NAME#v}"
          echo "Logging in as '${GITHUB_ACTOR}:${{ github.token }}'..."
          echo "${{ github.token }}" | helm registry login ghcr.io \
            --username "${GITHUB_ACTOR}" \
            --password-stdin \
            && echo "Logged in" || { echo "Failed to log in"; exit 1; }
          helm push "./output/actions-${VERSION}.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
