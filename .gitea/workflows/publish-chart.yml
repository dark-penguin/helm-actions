name: publish-chart

on:
  push:
    tags:
      - "*"
  workflow_dispatch:  # Allow manually launching the workflow
    inputs:
      version:  # But you'll have to specify chart version
        description: Chart version (without leading v)
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  HELM_VERSION: "4.3.1"

jobs:
  generate-chart-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Helm
        uses: https://github.com/Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5 # Gitea
        #uses: Azure/setup-helm@v5 # Github / Act
        with:
          version: "${{ env.HELM_VERSION }}"

      - name: Install helm-push plugin
        run: |
          helm plugin install --verify=false https://github.com/chartmuseum/helm-push --version 0.11.1

      - name: Package chart
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ -n "$VERSION" ]] || VERSION="${GITHUB_REF_NAME#v}"
          helm dependency build
          mkdir -p ./output
          helm package --version "$VERSION" --destination ./output ./

      - name: Publish chart
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ -n "$VERSION" ]] || VERSION="${GITHUB_REF_NAME#v}"
          echo "Logging in as '${GITHUB_ACTOR}:${{ secrets.MY_PACKAGE_TOKEN }}'..."
          helm repo add gitea ${GITHUB_SERVER_URL}/api/packages/${GITHUB_REPOSITORY_OWNER}/helm \
            --username "${GITHUB_ACTOR}" \
            --password "${{ secrets.MY_PACKAGE_TOKEN }}" && echo "Logged in" || { echo "Failed to log in"; exit 1; }

          echo -e "\nPublishing ..."
          helm cm-push "./output/actions-${VERSION}.tgz" gitea
