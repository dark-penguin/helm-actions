suite: actions template | native Kubernetes
release:
  name: native-test
  namespace: runners
templates:
  - templates/statefulset.yaml
  - templates/configmap.yaml
  - templates/serviceaccount.yaml
  - templates/rbac.yaml
tests:
  - it: creates no serviceaccount.yaml by default
    set:
      enabled: true
    asserts:
      - hasDocuments:
          count: 0
    template: serviceaccount.yaml
  - it: creates no serviceaccount.yaml when the chart is disabled
    set:
      serviceAccount.create: true
      rbac.create: true
    asserts:
      - hasDocuments:
          count: 0
    template: serviceaccount.yaml
  - it: creates no rbac.yaml by default
    set:
      enabled: true
    asserts:
      - hasDocuments:
          count: 0
    template: rbac.yaml
  - it: creates no rbac.yaml when the chart is disabled
    set:
      serviceAccount.create: true
      rbac.create: true
    asserts:
      - hasDocuments:
          count: 0
    template: rbac.yaml
  - it: removes DinD and its socket while retaining runner data and configuration
    set:
      enabled: true
      statefulset.dind.rootless: true
      statefulset.dind.uid: 1001
      statefulset.dind.enabled: false
      serviceAccount.create: true
      rbac.create: true
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 1
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: reach-gitea
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: runner-config
              configMap:
                name: native-test-runner-configmap
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - mountPath: /runner/config.yaml
              name: runner-config
              subPath: config.yaml
            - mountPath: /data
              name: data-runner
      - equal:
          path: spec.template.spec.serviceAccountName
          value: native-test-runner
    template: statefulset.yaml
  - it: preserves extra init containers and volumes without DinD
    set:
      enabled: true
      statefulset.dind.enabled: false
      serviceAccount.create: true
      rbac.create: true
      preExtraInitContainers:
        - name: before
          image: busybox
      postExtraInitContainers:
        - name: after
          image: busybox
      statefulset.extraVolumes:
        - name: extra
          emptyDir: {}
      statefulset.runner.extraVolumeMounts:
        - name: extra
          mountPath: /extra
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: before
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: reach-gitea
      - equal:
          path: spec.template.spec.initContainers[2].name
          value: after
      - equal:
          path: spec.template.spec.volumes[1].name
          value: extra
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[2].name
          value: extra
    template: statefulset.yaml
  - it: creates a service account in runners
    set: &native
      enabled: true
      statefulset.dind.enabled: false
      serviceAccount.create: true
      rbac.create: true
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: native-test-runner
      - equal:
          path: metadata.namespace
          value: runners
    template: serviceaccount.yaml
  - it: creates only the required job permissions in runners
    set: *native
    asserts:
      - isKind:
          of: Role
      - equal:
          path: metadata.name
          value: native-test-runner
      - equal:
          path: metadata.namespace
          value: runners
      - equal:
          path: rules
          value:
            - apiGroups:
                - ''
              resources:
                - pods
              verbs:
                - create
                - get
                - list
                - delete
            - apiGroups:
                - ''
              resources:
                - pods/exec
              verbs:
                - create
                - get
            - apiGroups:
                - ''
              resources:
                - pods/log
              verbs:
                - get
            - apiGroups:
                - ''
              resources:
                - secrets
              verbs:
                - create
                - delete
    template: rbac.yaml
    documentIndex: 0
  - it: binds permissions to the manager account in runners
    set: *native
    asserts:
      - isKind:
          of: RoleBinding
      - equal:
          path: metadata.namespace
          value: runners
      - equal:
          path: roleRef
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: native-test-runner
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: native-test-runner
              namespace: runners
    template: rbac.yaml
    documentIndex: 1
  - it: creates a service account in custom-namespace
    set: &customNamespace
      enabled: true
      statefulset.dind.enabled: false
      serviceAccount.create: true
      rbac.create: true
      namespace: custom-namespace
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: native-test-runner
      - equal:
          path: metadata.namespace
          value: custom-namespace
    template: serviceaccount.yaml
  - it: creates only the required job permissions in custom-namespace
    set: *customNamespace
    asserts:
      - isKind:
          of: Role
      - equal:
          path: metadata.name
          value: native-test-runner
      - equal:
          path: metadata.namespace
          value: custom-namespace
      - equal:
          path: rules
          value:
            - apiGroups:
                - ''
              resources:
                - pods
              verbs:
                - create
                - get
                - list
                - delete
            - apiGroups:
                - ''
              resources:
                - pods/exec
              verbs:
                - create
                - get
            - apiGroups:
                - ''
              resources:
                - pods/log
              verbs:
                - get
            - apiGroups:
                - ''
              resources:
                - secrets
              verbs:
                - create
                - delete
    template: rbac.yaml
    documentIndex: 0
  - it: binds permissions to the manager account in custom-namespace
    set: *customNamespace
    asserts:
      - isKind:
          of: RoleBinding
      - equal:
          path: metadata.namespace
          value: custom-namespace
      - equal:
          path: roleRef
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: native-test-runner
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: native-test-runner
              namespace: custom-namespace
    template: rbac.yaml
    documentIndex: 1
  - it: uses the chosen account when create is true
    set: &createdAccount
      enabled: true
      statefulset.dind.enabled: false
      serviceAccount.create: true
      rbac.create: true
      statefulset.serviceAccountName: chosen-account
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: chosen-account
    template: statefulset.yaml
  - it: binds the chosen account when create is true
    set: *createdAccount
    asserts:
      - equal:
          path: subjects[0].name
          value: chosen-account
    template: rbac.yaml
    documentIndex: 1
  - it: handles the chosen account when create is true
    set: *createdAccount
    asserts:
      - equal:
          path: metadata.name
          value: chosen-account
    template: serviceaccount.yaml
  - it: uses the chosen account when create is false
    set: &existingAccount
      enabled: true
      statefulset.dind.enabled: false
      serviceAccount.create: false
      rbac.create: true
      statefulset.serviceAccountName: chosen-account
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: chosen-account
    template: statefulset.yaml
  - it: binds the chosen account when create is false
    set: *existingAccount
    asserts:
      - equal:
          path: subjects[0].name
          value: chosen-account
    template: rbac.yaml
    documentIndex: 1
  - it: handles the chosen account when create is false
    set: *existingAccount
    asserts:
      - hasDocuments:
          count: 0
    template: serviceaccount.yaml
  - it: supports externally managed permissions
    set:
      enabled: true
      statefulset.dind.enabled: false
      serviceAccount.create: true
      rbac.create: false
    asserts:
      - hasDocuments:
          count: 0
    template: rbac.yaml
  - it: keeps DinD available with Kubernetes permissions for mixed labels
    set:
      enabled: true
      statefulset.dind.enabled: true
      serviceAccount.create: true
      rbac.create: true
    asserts:
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: dind
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].name
          value: docker-socket
      - equal:
          path: spec.template.spec.serviceAccountName
          value: native-test-runner
    template: statefulset.yaml
  - it: preserves Docker defaults when an upgrade reuses values without the new options
    template: statefulset.yaml
    set: &legacyValues
      enabled: true
      serviceAccount: null
      rbac: null
      statefulset.dind.enabled: null
    asserts:
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: dind
      - equal:
          path: spec.template.spec.volumes[1].name
          value: docker-socket
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].name
          value: docker-socket
      - notExists:
          path: spec.template.spec.serviceAccountName
  - it: creates no service account when reusing legacy values
    template: serviceaccount.yaml
    set: *legacyValues
    asserts:
      - hasDocuments:
          count: 0
  - it: creates no RBAC when reusing legacy values
    template: rbac.yaml
    set: *legacyValues
    asserts:
      - hasDocuments:
          count: 0
  - it: preserves a boolean-looking service account name as a string
    template: serviceaccount.yaml
    set:
      enabled: true
      serviceAccount.create: true
      statefulset.serviceAccountName: "true"
    asserts:
      - equal:
          path: metadata.name
          value: "true"
  - it: preserves a numeric existing service account name as a string in its binding
    template: rbac.yaml
    documentIndex: 1
    set:
      enabled: true
      rbac.create: true
      statefulset.serviceAccountName: "123"
    asserts:
      - equal:
          path: subjects[0].name
          value: "123"
  - it: retains rootless Docker socket paths when DinD is enabled
    template: statefulset.yaml
    set:
      enabled: true
      statefulset.dind.rootless: true
      statefulset.dind.uid: 1001
    asserts:
      - equal:
          path: spec.template.spec.initContainers[1].volumeMounts[0].mountPath
          value: /run/user/1001/
      - equal:
          path: spec.template.spec.initContainers[1].startupProbe.exec.command[2]
          value: /run/user/1001/docker.sock
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].mountPath
          value: /var/run/docker.sock
