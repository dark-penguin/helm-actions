suite: actions template | consistency checks
release:
  name: gitea-actions-unittests
  namespace: testing
templates:
  - templates/01-consistency-checks.yaml
tests:
  - it: fails when provisioning is disabled BUT existingSecret and existingSecretKey are missing
    set:
      enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "existingSecret and existingSecretKey are required when provisioning is disabled"
  - it: fails when provisioning is disabled BUT existingSecretKey is missing
    set:
      enabled: true
      existingSecret: "my-secret"
    asserts:
      - failedTemplate:
          errorMessage: "existingSecret and existingSecretKey are required when provisioning is disabled"
  - it: fails when provisioning is disabled BUT existingSecret is missing
    set:
      enabled: true
      existingSecretKey: "my-secret-key"
    asserts:
      - failedTemplate:
          errorMessage: "existingSecret and existingSecretKey are required when provisioning is disabled"
  - it: fails when LOCAL_ROOT_URL is missing
    set:
      enabled: true
      existingSecret: "my-secret"
      existingSecretKey: "my-secret-key"
    asserts:
      - failedTemplate:
          errorMessage: "giteaRootURL is required"
  - it: requires an explicit service account when granting Kubernetes permissions
    set:
      enabled: true
      serviceAccount: null
      existingSecret: my-secret
      existingSecretKey: token
      giteaRootURL: https://gitea.example.com
      rbac.create: true
    asserts:
      - failedTemplate:
          errorMessage: "rbac.create requires serviceAccount.create or statefulset.serviceAccountName"
  - it: accepts reused legacy values without the new creation maps
    set:
      enabled: true
      existingSecret: my-secret
      existingSecretKey: token
      giteaRootURL: https://gitea.example.com
      serviceAccount: null
      rbac: null
    asserts:
      - hasDocuments:
          count: 0
